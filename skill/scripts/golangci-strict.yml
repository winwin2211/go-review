version: "2"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - errorlint
    - nilerr
    - bodyclose
    - noctx
    - contextcheck
    - rowserrcheck
    - sqlclosecheck
    - prealloc
    - unconvert
    - unparam
    - gocritic
    - revive
    - misspell
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
